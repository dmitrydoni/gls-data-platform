gls_dwh:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "../data/gls_platform.duckdb"
      schema: main
      threads: 4

    # The deployment target the DAG names. Credentials come from the runtime
    # service account, never from this file.
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', '') }}"
      dataset: core_prod
      location: europe-west3
      threads: 8
